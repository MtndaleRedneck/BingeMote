name: Diag connected-drop
# Bounded diagnostic (no publish, no release, no write permissions): runs ONLY
# DisconnectedHomeUiTest#connectedThenDropReadsZeroThenReconnects, N=10 iterations in ONE
# emulator session, and uploads stub request logs, logcat and diag pixels per iteration.
on:
  push:
    branches: [diag-1125]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/diag-connected-drop.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BingeMote-diag
          path: diag/*
