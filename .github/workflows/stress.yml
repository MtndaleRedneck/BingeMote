name: stress
on:
  push:
    branches: [stress-untested, "i1/*"]
  workflow_dispatch:

jobs:
  # Gate: rev15 must pass its full existing runtime suite before the stress run means anything.
  e2e-gate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Helper unit tests
        run: dotnet test helper/BingeMoteHelper.Tests/BingeMoteHelper.Tests.csproj -c Release
      - name: Publish TEST helper exe (CI hooks; never shipped)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK%3BKEEPAWAKE_HOOK%3BBROKER_TEST_HOOK" -o helper/out
      - name: Install VLC (for the movies launch test)
        run: choco install vlc --no-progress -y
      - name: Build the installer from the test build (for the install/uninstall test)
        run: |
          choco install innosetup --no-progress -y
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" helper/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Helper runtime tests (install/uninstall, pairing, endpoints, broker, UIPI)
        # Below the 35-min job cap so a hang FAILS the step and keeps the log;
        # a job-level timeout cancels the job and GitHub keeps no logs (run 43686017173).
        timeout-minutes: 28
        run: pwsh -File scripts/helper-e2e.ps1
      - name: VLC control tests (real VLC, app request shapes)
        run: pwsh -File scripts/vlc-e2e.ps1
      # rev20 (Instinct 2 round 3): the heartbeat snapshots are their own artifact,
      # uploaded unconditionally - a step-timeout kill or a hung main can leave the
      # newest snapshots in TEMP with the run log lost, so they never ride the log alone.
      - name: Stage heartbeat snapshots
        if: always()
        run: |
          $out = "$env:GITHUB_WORKSPACE\e2e-heartbeat"
          New-Item -ItemType Directory $out -Force | Out-Null
          $log = "$env:TEMP\bm-e2e-heartbeat.log"; $ps1 = "$env:TEMP\bm-e2e-heartbeat.ps1"
          if (Test-Path $log) { Copy-Item $log $out\ } else { Write-Host "WARNING: heartbeat log missing ($log) - the e2e died before the watcher started" }
          if (Test-Path $ps1) { Copy-Item $ps1 $out\ } else { Write-Host "WARNING: heartbeat script missing ($ps1)" }
          Get-ChildItem $out | Select-Object Name, Length
      - name: Upload heartbeat snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-heartbeat
          path: e2e-heartbeat
          if-no-files-found: warn

  # Fault-confirmation suite: Instinct 2's static review findings as runtime assertions.
  broker-faults:
    needs: e2e-gate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish TEST helper exe (CI hooks; never shipped)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK%3BKEEPAWAKE_HOOK%3BBROKER_TEST_HOOK" -o helper/out
      - name: Broker fault tests (dedup, held buttons, breaker, restart, poison)
        run: pwsh -File scripts/broker-faults.ps1
      - name: Stage fault logs
        if: always()
        run: |
          $out = "$env:GITHUB_WORKSPACE\fault-logs"
          New-Item -ItemType Directory $out -Force | Out-Null
          Copy-Item "$env:LOCALAPPDATA\BingeMote\helper.log" "$out\helper-user.log" -ErrorAction SilentlyContinue
          Copy-Item 'C:\Windows\System32\config\systemprofile\AppData\Local\BingeMote\helper.log' "$out\helper-system.log" -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\bf-*.txt" $out\ -ErrorAction SilentlyContinue
          Get-ChildItem $out | Select-Object Name, Length
      - name: Upload fault logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-logs
          path: fault-logs
          if-no-files-found: warn

  stress:
    needs: e2e-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish TEST helper exe (CI hooks; never shipped)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK%3BKEEPAWAKE_HOOK%3BBROKER_TEST_HOOK" -o helper/out
      - name: Helper stress tests (streams, crash/recovery, churn, abuse, restarts, soak)
        run: pwsh -File scripts/helper-stress.ps1
      - name: Stage stress logs
        if: always()
        run: |
          $out = "$env:GITHUB_WORKSPACE\stress-logs"
          New-Item -ItemType Directory $out -Force | Out-Null
          Copy-Item "$env:LOCALAPPDATA\BingeMote\helper.log" "$out\helper-user.log" -ErrorAction SilentlyContinue
          Copy-Item 'C:\Windows\System32\config\systemprofile\AppData\Local\BingeMote\helper.log' "$out\helper-system.log" -ErrorAction SilentlyContinue
          Copy-Item helper\stress-summary.json $out\ -ErrorAction SilentlyContinue
          Get-ChildItem $out | Select-Object Name, Length
      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs
          path: stress-logs
          if-no-files-found: warn
