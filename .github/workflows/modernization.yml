name: Modernization verification
on:
  push:
    branches: [tmp/modernization-1124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Unit tests and debug test build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Signed release build, no public binary upload
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
          ./gradlew --no-daemon -PrecoveryReleaseTest assembleReleaseAndroidTest
          stat -c "RELEASE_APK_BYTES=%s" app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/modernization-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-modernization-evidence
          path: |
            modernization-evidence/
            app/build/outputs/mapping/release/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 3

  pc-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Unit, palette and URL permission tests
        run: dotnet test helper/BingeMoteHelper.Tests/BingeMoteHelper.Tests.csproj -c Release --filter 'FullyQualifiedName!~RealVlc' --logger 'trx;LogFileName=modernization-pc.trx'
      - name: Compile production helper
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o helper/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PC-modernization-evidence
          path: helper/BingeMoteHelper.Tests/TestResults/*.trx
          retention-days: 3
