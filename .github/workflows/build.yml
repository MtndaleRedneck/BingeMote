name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after review and verification
        type: boolean
        default: false
      target:
        description: Which side to publish (app and helper version separately)
        type: choice
        options: [app, helper]
        default: helper

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BingeMote-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-apk
          path: BingeMote-v*.apk


  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish helper exe
        run: |
          dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o helper/out

      - name: Name the exe (helper versions separately from the app)
        run: |
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          echo "HELPER_VERSION=$v" >> $env:GITHUB_ENV
          Copy-Item helper/out/BingeMoteHelper.exe "BingeMoteHelper-v$v.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: BingeMoteHelper-exe
          path: BingeMoteHelper-v*.exe

      - name: Build the installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:HELPER_VERSION" helper/installer.iss
          Move-Item helper/Output/BingeMoteHelper-Setup-*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: BingeMoteHelper-Setup
          path: BingeMoteHelper-Setup-*.exe

  helper-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish helper exe (with the CI-only pairing hook)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK" -o helper/out

      - name: Helper runtime tests (pairing, endpoints, discovery, firewall setup)
        run: pwsh -File scripts/helper-e2e.ps1

      - name: VLC control tests (real VLC, app request shapes)
        run: pwsh -File scripts/vlc-e2e.ps1


  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-screenshots
          path: screenshots/*.png

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: [android, helper, helper-e2e, screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BingeMote*-*
          merge-multiple: true
          path: artifacts
      - name: Publish reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          if [ "$TARGET" = "app" ]; then
            V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            [[ "$V" != 0.* ]]
            gh release create "app-v$V" "artifacts/BingeMote-v$V.apk" --target "$(git rev-parse HEAD)" --title "BingeMote app v$V" --notes-file release-notes-app.md
          else
            V=$(grep -oP '<Version>\K[^<]+' helper/BingeMoteHelper/BingeMoteHelper.csproj | sed 's/\.0$//')
            # Helper releases never take "latest" - the installed app's updater reads it.
            gh release create "helper-v$V" "artifacts/BingeMoteHelper-v$V.exe" --target "$(git rev-parse HEAD)" --title "BingeMote Helper v$V" --notes-file release-notes-helper.md --latest=false
          fi
