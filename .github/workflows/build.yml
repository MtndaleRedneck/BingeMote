name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after review and verification
        type: boolean
        default: false
      target:
        description: Which side to publish (Android and PC version separately)
        type: choice
        options: [app, helper]
        default: helper

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BingeMote-Android-$V.apk

      # Review verification: the exact artifact hashes in the run log (Instinct 2).
      - name: Print APK hashes
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk BingeMote-Android-*.apk

      # The debug APK on every run, so a review can install the exact bytes CI
      # exercised (the signed release APK above only uploads on publish runs).
      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        with:
          name: BingeMote-Android-apk
          path: BingeMote-Android-*.apk


  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Helper unit tests
        run: dotnet test helper/BingeMoteHelper.Tests/BingeMoteHelper.Tests.csproj -c Release

      # SHIPPING build. No CI hooks and no TRACE: DefineConstants is pinned empty so
      # the hook code (BROKER_TEST_HOOK: --broker-hold/--broker-flood; PAIR_CODE_HOOK:
      # fixed pairing codes; KEEPAWAKE_HOOK: /ci/hold; WINDOW_SHOT_HOOK: --window-shot)
      # is compiled OUT of the exe that ships in BingeMote-PC-*.exe. The hooked build
      # the e2e runs against is a separate publish inside the helper-e2e job below and
      # never leaves that job.
      - name: Publish helper exe (shipping build - no CI hooks, no TRACE)
        run: |
          dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=" -o helper/out

      # Prove it at the binary level on every build: the shipped raw exe must contain
      # neither the hook verbs (string literals, stored UTF-16) nor the hook symbols
      # (metadata, stored UTF-8). The installer compresses its payload, so only the
      # raw exe can be scanned - scan both alignments of a UTF-16 decode for literals.
      - name: Verify the shipping exe carries no CI hooks
        run: |
          $bytes = [IO.File]::ReadAllBytes("helper/out/BingeMote.exe")
          $even = [Text.Encoding]::Unicode.GetString($bytes, 0, $bytes.Length - ($bytes.Length % 2))
          $odd  = [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1 - (($bytes.Length - 1) % 2))
          $meta = [Text.Encoding]::UTF8.GetString($bytes)
          $literals = @('--broker-hold', '--broker-flood', '--broker-flood2', '--broker-send', '--broker-holddown', '--broker-silent-server', '--broker-delayed-run', '--broker-op', '--verify-pid', '--idle', '--hold-events', '--try-open', '--restrict-self', '--window-shot', '--osd-shot', 'ci/hold')
          # Compile-time constant names never appear in a binary, so only the hook
          # type's own metadata name is worth scanning for here.
          $symbols  = @('BrokerTestHook')
          $bad = @()
          foreach ($m in $literals) { if ($even.Contains($m) -or $odd.Contains($m)) { $bad += "literal '$m'" } }
          foreach ($m in $symbols)  { if ($meta.Contains($m)) { $bad += "symbol '$m'" } }
          if ($bad.Count) { throw "shipping exe contains CI hook markers: $($bad -join ', ')" }
          Write-Host "clean: the shipping exe contains no CI hook markers ($($bytes.Length) bytes scanned)"

      - name: Name the exe (helper versions separately from the app)
        run: |
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          echo "HELPER_VERSION=$v" >> $env:GITHUB_ENV

      # The raw shipped single-file exe, for the binary-level CI-hook absence proof:
      # the installer compresses its payload, so only the raw exe can be string-scanned.
      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC-raw
          path: helper/out/BingeMote.exe
          if-no-files-found: error

      - name: Build the installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:HELPER_VERSION" helper/installer.iss
          Move-Item helper/Output/BingeMote-PC-*.exe .

      # Review verification: the exact artifact hashes in the run log (Instinct 2).
      - name: Print helper artifact hashes
        run: |
          Get-FileHash helper/out/BingeMote.exe -Algorithm SHA256 | Format-List
          Get-FileHash BingeMote-PC-*.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC
          path: BingeMote-PC-*.exe

  helper-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # TEST build: the only build with the CI hooks. Runs the e2e below and builds
      # the installer for the install/uninstall test; none of its outputs ship.
      - name: Publish TEST helper exe (CI hooks; never shipped)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK%3BKEEPAWAKE_HOOK%3BBROKER_TEST_HOOK" -o helper/out

      # The movies test launches real VLC; install it as its own step so a mirror hiccup is visible.
      - name: Install VLC (for the movies launch test)
        run: choco install vlc --no-progress -y

      - name: Build the installer from the test build (for the install/uninstall test)
        run: |
          choco install innosetup --no-progress -y
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" helper/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Render the window for layout review (CI only)
        run: |
          dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BWINDOW_SHOT_HOOK" -o helper/shot
          $env:BINGEMOTE_WINDOW_SHOT = "$PWD\helper\window.png"
          & helper/shot/BingeMote.exe --window-shot
          $env:BINGEMOTE_OSD_SHOT = "$PWD\helper\osd.png"
          $env:BINGEMOTE_OSD_SHOT_MUTED = "$PWD\helper\osd-muted.png"
          & helper/shot/BingeMote.exe --osd-shot

      - name: Upload the window shot
        uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC-window
          path: |
            helper/window.png
            helper/window-screen.png
            helper/window-diag.txt
            helper/osd.png
            helper/osd-muted.png
            helper/osd.frame.png
            helper/osd-muted.frame.png
          if-no-files-found: error

      - name: Helper runtime tests (pairing, endpoints, discovery, firewall setup)
        # 28-min cap matches the stress gate: a hang dies inside the step so the
        # job keeps its log (a job-level cancel keeps none) and the heartbeat
        # snapshots in the log show the last live state.
        timeout-minutes: 28
        run: pwsh -File scripts/helper-e2e.ps1

      - name: VLC control tests (real VLC, app request shapes)
        run: pwsh -File scripts/vlc-e2e.ps1


  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BingeMote-screenshots
          path: screenshots/*

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: [android, helper, helper-e2e, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BingeMote*-*
          merge-multiple: true
          path: artifacts
      - name: Publish reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          # Release pages show ONLY their own version's notes (Ezzy's rule, Oct 2026):
          # extract the "## v$V" section from the running notes file.
          if [ "$TARGET" = "app" ]; then
            V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            [[ "$V" != 0.* ]]
            awk -v v="## v$V" 'BEGIN{f=0} $0 ~ /^## / { if($0==v){f=1}else if(f){exit} } f' release-notes-app.md > /tmp/notes.md
            [[ -s /tmp/notes.md ]]
            gh release create "android-v$V" "artifacts/BingeMote-Android-$V.apk" --target "$(git rev-parse HEAD)" --title "BingeMote Android v$V" --notes-file /tmp/notes.md
          else
            V=$(grep -oP '<Version>\K[^<]+' helper/BingeMoteHelper/BingeMoteHelper.csproj | sed 's/\.0$//')
            # Helper releases never take "latest" - the installed app's updater reads it.
            awk -v v="## v$V" 'BEGIN{f=0} $0 ~ /^## / { if($0==v){f=1}else if(f){exit} } f' release-notes-pc.md > /tmp/notes.md
            [[ -s /tmp/notes.md ]]
            gh release create "pc-v$V" "artifacts/BingeMote-PC-$V.exe" --target "$(git rev-parse HEAD)" --title "BingeMote PC v$V" --notes-file /tmp/notes.md --latest=false
          fi
