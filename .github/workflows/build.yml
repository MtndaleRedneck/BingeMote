name: Build

on:
  push:
    branches: [main, bundle/1.12.12, tmp/phone-test-tooling]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after review and verification
        type: boolean
        default: false
      target:
        description: Which side to publish (Android and PC version separately)
        type: choice
        options: [app, helper]
        default: helper

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both configs tonight's failures could not be attributed between (the
        # failing run's own config was deleted with its run).
        api: [31, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build (unsigned - validation only on TestLab; signed bundle builds elsewhere)
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator (bar actions, update survival, bar spacing)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # Explicit image coordinates: the action's defaults (x86/default) resolve to a
          # system image Google no longer serves. These match the screenshots job.
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # The staging logic lives in a script file: this action runs EACH LINE
          # of an inline script as its own /usr/bin/sh -c invocation, so no
          # variable or set +e survives across lines (run 45018522227).
          script: bash scripts/run-android-e2e.sh ${{ matrix.api }}

      # The job log carries no device logcat, which made one instrumentation
      # process-crash undiagnosable. Capture runs during the tests (above) so a
      # dead emulator still leaves its buffer; print it after every leg.
      - name: Print device logcat
        if: always()
        run: tail -2000 /tmp/device-logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diag-api${{ matrix.api }}
          path: /tmp/bm-diag/
          if-no-files-found: ignore

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk BingeMote-Android-$V.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        with:
          name: BingeMote-Android-apk
          path: BingeMote-Android-*.apk


  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Helper unit tests
        run: dotnet test helper/BingeMoteHelper.Tests/BingeMoteHelper.Tests.csproj -c Release

      - name: Publish helper exe
        run: |
          dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o helper/out

      - name: Name the exe (helper versions separately from the app)
        run: |
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          echo "HELPER_VERSION=$v" >> $env:GITHUB_ENV

      # The raw shipped single-file exe, for the binary-level CI-hook absence proof:
      # the installer compresses its payload, so only the raw exe can be string-scanned.
      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC-raw
          path: helper/out/BingeMote.exe
          if-no-files-found: error

      - name: Build the installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:HELPER_VERSION" helper/installer.iss
          Move-Item helper/Output/BingeMote-PC-*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC
          path: BingeMote-PC-*.exe

  helper-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish helper exe (with the CI-only pairing hook)
        run: dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BPAIR_CODE_HOOK%3BKEEPAWAKE_HOOK" -o helper/out

      # The movies test launches real VLC; install it as its own step so a mirror hiccup is visible.
      - name: Install VLC (for the movies launch test)
        run: choco install vlc --no-progress -y

      - name: Build the installer from the test build (for the install/uninstall test)
        run: |
          choco install innosetup --no-progress -y
          $v = Select-String -Path helper/BingeMoteHelper/BingeMoteHelper.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches.Groups[1].Value -replace '\.0$','' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" helper/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Render the window for layout review (CI only)
        run: |
          dotnet publish helper/BingeMoteHelper/BingeMoteHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:DefineConstants=TRACE%3BWINDOW_SHOT_HOOK" -o helper/shot
          $env:BINGEMOTE_WINDOW_SHOT = "$PWD\helper\window.png"
          & helper/shot/BingeMote.exe --window-shot
          $env:BINGEMOTE_OSD_SHOT = "$PWD\helper\osd.png"
          $env:BINGEMOTE_OSD_SHOT_MUTED = "$PWD\helper\osd-muted.png"
          & helper/shot/BingeMote.exe --osd-shot

      - name: Upload the window shot
        uses: actions/upload-artifact@v4
        with:
          name: BingeMote-PC-window
          path: |
            helper/window.png
            helper/window-screen.png
            helper/window-diag.txt
            helper/osd.png
            helper/osd-muted.png
          if-no-files-found: error

      - name: Helper runtime tests (pairing, endpoints, discovery, firewall setup)
        run: pwsh -File scripts/helper-e2e.ps1

      - name: VLC control tests (real VLC, app request shapes)
        run: pwsh -File scripts/vlc-e2e.ps1


  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BingeMote-screenshots
          path: screenshots/*

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: [android, helper, helper-e2e, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BingeMote*-*
          merge-multiple: true
          path: artifacts
      - name: Publish reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          # Release pages show ONLY their own version's notes:
          # extract the "## v$V" section from the running notes file.
          if [ "$TARGET" = "app" ]; then
            V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            [[ "$V" != 0.* ]]
            awk -v v="## v$V" 'BEGIN{f=0} $0 ~ /^## / { if($0==v){f=1}else if(f){exit} } f' release-notes-app.md > /tmp/notes.md
            [[ -s /tmp/notes.md ]]
            gh release create "android-v$V" "artifacts/BingeMote-Android-$V.apk" --target "$(git rev-parse HEAD)" --title "BingeMote Android v$V" --notes-file /tmp/notes.md
          else
            V=$(grep -oP '<Version>\K[^<]+' helper/BingeMoteHelper/BingeMoteHelper.csproj | sed 's/\.0$//')
            # Helper releases never take "latest" - the installed app's updater reads it.
            awk -v v="## v$V" 'BEGIN{f=0} $0 ~ /^## / { if($0==v){f=1}else if(f){exit} } f' release-notes-pc.md > /tmp/notes.md
            [[ -s /tmp/notes.md ]]
            gh release create "pc-v$V" "artifacts/BingeMote-PC-$V.exe" --target "$(git rev-parse HEAD)" --title "BingeMote PC v$V" --notes-file /tmp/notes.md --latest=false
          fi
