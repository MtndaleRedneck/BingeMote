name: Build

on:
  push:
    branches: [tmp/pc-1712, tmp/pairing-refresh]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after review and verification
        type: boolean
        default: false
      target:
        description: Which side to publish (Android and PC version separately)
        type: choice
        options: [app, helper]
        default: helper
      only:
        description: Limit the run (pc-e2e skips the android/scanner/screenshot jobs; stage runs only the android/helper builds and stages the signed bytes to the private TestLab draft)
        type: choice
        options: [all, pc-e2e, stage, verify]
        default: all
      shipping_run_id:
        description: Run ID whose BingeMote-PC artifact the e2e shipping leg tests (leave empty to skip that leg)
        type: string
        default: ''
      shipping_testlab_asset_id:
        description: TestLab draft asset ID whose staged installer bytes the e2e shipping leg tests (leave empty to skip that source)
        type: string
        default: ''
      shipping_sha256:
        description: Expected sha256 of those shipping bytes (asserted by the e2e shipping leg)
        type: string
        default: ''
      force:
        description: GATE-PROOF fault injection
        type: choice
        options: [none, focused-fail, skip-scanner]
        default: none
      restage:
        description: 'Explicitly authorized restage: replace staged draft assets (never replaces a visible release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'pc-e2e'
    runs-on: ubuntu-latest
    steps:
      - run: echo trivial android ok
  helper:
    if: github.event_name != 'workflow_dispatch' || inputs.only != 'stage' || inputs.target == 'helper'
    runs-on: ubuntu-latest
    steps:
      - run: echo trivial helper ok
  helper-e2e:
    if: github.event_name != 'workflow_dispatch' || (inputs.only != 'stage' && inputs.only != 'verify')
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - run: echo trivial helper-e2e ok
  scanner-test:
    if: inputs.force != 'skip-scanner' && (github.event_name != 'workflow_dispatch' || (inputs.only != 'pc-e2e' && inputs.only != 'stage' && inputs.only != 'verify'))
    runs-on: ubuntu-latest
    steps:
      - run: echo trivial scanner-test ok
  focused-ui:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: forced failure
        if: inputs.force == 'focused-fail'
        run: echo forced focused-ui failure; exit 1
      - run: echo trivial focused-ui ok
  screenshots:
    if: github.event_name != 'workflow_dispatch' || (inputs.only != 'pc-e2e' && inputs.only != 'stage' && inputs.only != 'verify')
    runs-on: ubuntu-latest
    steps:
      - run: echo trivial screenshots ok
  release-gate:
    # Fail-closed: every required job must be exactly "success". failure, cancelled,
    # skipped, missing and unknown all block publication. if: always() so a failed or
    # skipped need still produces a logged table here instead of silently skipping.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.only == 'all'
    needs: [android, helper, helper-e2e, scanner-test, focused-ui, screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required-job table (all must be success)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf '%s' "$NEEDS_JSON" | bash scripts/release-gate.sh android helper helper-e2e scanner-test focused-ui screenshots
      - name: Gate self-test (discriminates failure, skipped, cancelled, missing)
        run: bash scripts/release-gate-test.sh

  release:
    if: needs.release-gate.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.only == 'all'
    needs: [release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "DRY RELEASE JOB RAN - gate passed. Nothing published."
