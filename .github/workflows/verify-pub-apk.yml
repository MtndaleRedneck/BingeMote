name: Verify PUBLIC release APKs install-over (test only, never publishes)
on:
  push:
    branches: ['verify/pub-**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the public release assets
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p verify
          gh release download android-v1.12.0 -p '*.apk' -O verify/old.apk
          gh release download android-v1.12.1 -p '*.apk' -O verify/new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/verify-apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BingeMote-pub-verify
          path: verify/*
          retention-days: 7
