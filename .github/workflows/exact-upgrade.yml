name: Exact private Android upgrade verification
on:
  workflow_dispatch:
    inputs:
      asset_id:
        required: true
        type: string
      sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  exact-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
      - name: Get exact prior and staged private APKs
        env:
          GH_TOKEN: ${{ secrets.TESTLAB_PAT }}
          NEW_ASSET_ID: ${{ inputs.asset_id }}
          NEW_HASH: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$NEW_ASSET_ID" =~ ^[0-9]+$ ]]
          [[ "$NEW_HASH" =~ ^[a-f0-9]{64}$ ]]
          gh api -H 'Accept: application/octet-stream' repos/MtndaleRedneck/TestLab/releases/assets/783951471 > prior.apk
          gh api -H 'Accept: application/octet-stream' "repos/MtndaleRedneck/TestLab/releases/assets/$NEW_ASSET_ID" > staged.apk
          echo '5fd9d461b7695e436d85c852fec75480f4a8759d657715f32a47591994531bec  prior.apk' | sha256sum -c
          printf '%s  staged.apk\n' "$NEW_HASH" | sha256sum -c
      - name: Build same-signer instrumentation only
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: bingemote
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon -PrecoveryReleaseTest assembleReleaseAndroidTest
          for apk in prior.apk staged.apk app/build/outputs/apk/androidTest/release/app-release-androidTest.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p exact-upgrade-evidence
            adb install prior.apk
            adb install app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -r -e class com.bingemote.RecoveryContinuityTest -e phase seed com.bingemote.test/androidx.test.runner.AndroidJUnitRunner | tee exact-upgrade-evidence/seed.txt
            grep -q '^OK (' exact-upgrade-evidence/seed.txt
            adb install -r staged.apk
            adb shell am instrument -w -r -e class com.bingemote.RecoveryContinuityTest -e phase verify com.bingemote.test/androidx.test.runner.AndroidJUnitRunner | tee exact-upgrade-evidence/verify.txt
            grep -q '^OK (' exact-upgrade-evidence/verify.txt
            adb shell dumpsys package com.bingemote > exact-upgrade-evidence/package.txt
            adb shell am start -n com.bingemote/.MainActivity
            sleep 4
            adb exec-out screencap -p > exact-upgrade-evidence/production-native.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Exact-private-upgrade-evidence
          path: exact-upgrade-evidence/
          retention-days: 3
