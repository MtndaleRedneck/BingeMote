# DRAFT - diagnostic only (Round1). Observes the SHIPPED pc-v1.9.1 installer and helper on a
# GitHub-hosted Windows runner; builds nothing, touches no product code, no main/release movement.
# TRIGGER: push to the single unique ref tmp/round1-diag-20261128 ONLY. That ref is cut from main
# plus exactly these two files, so no other workflow file exists on it that could match. It must
# receive exactly ONE push; any later push to it runs this workflow again. No workflow_dispatch
# (it would only work from the default branch). No other ref triggers this workflow.
name: Diag round1 shipped installer real helper
on:
  push:
    branches: [tmp/round1-diag-20261128]
permissions:
  contents: read

jobs:
  round1:
    if: github.ref == 'refs/heads/tmp/round1-diag-20261128'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, SHA-pinned (same pin as diag-locked-uninstall.yml)
        with:
          persist-credentials: false
      - name: Download shipped pc-v1.9.1 installer (hash verified inside the script)
        shell: pwsh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/r1dl" | Out-Null
          gh release download pc-v1.9.1 --repo "${{ github.repository }}" --pattern 'BingeMote-PC-1.9.1.exe' --dir "$env:RUNNER_TEMP/r1dl"
          if ($LASTEXITCODE -ne 0) { throw "release download failed rc=$LASTEXITCODE" }
          Get-ChildItem "$env:RUNNER_TEMP/r1dl" | ForEach-Object { "$($_.Name) $($_.Length)" }
      - name: Round1 diagnostics
        shell: pwsh
        timeout-minutes: 15
        env:
          ROUND1_INSTALLER: ${{ runner.temp }}\r1dl\BingeMote-PC-1.9.1.exe
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/round1-artifacts" | Out-Null
          & ./scripts/diag-round1.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/round1-artifacts/round1-transcript.txt"
          exit $LASTEXITCODE
      - name: Upload diagnostics (always, cancellation-safe)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2, SHA-pinned (same pin as diag-locked-uninstall.yml)
        with:
          name: diag-round1
          path: ${{ runner.temp }}/round1-artifacts
          if-no-files-found: warn
